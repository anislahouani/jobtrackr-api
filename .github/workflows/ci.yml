name: JobTrackr API CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore JobTrackr.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/JobTrackr.Api.Tests/JobTrackr.Api.Tests.csproj

      - name: Build API
        run: dotnet build JobTrackr.Api.csproj --no-restore --configuration Release

      - name: Build tests
        run: dotnet build tests/JobTrackr.Api.Tests/JobTrackr.Api.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet run --project tests/JobTrackr.Api.Tests/JobTrackr.Api.Tests.csproj --no-build --configuration Release
